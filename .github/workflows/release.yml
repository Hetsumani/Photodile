name: Release Builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: photodile
            asset_name: photodile-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: photodile.exe
            portable_zip: photodile-windows-x86_64-portable.zip
            msi_name: photodile-windows-x86_64.msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Package Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -DestinationPath ${{ matrix.portable_zip }}

      - name: Build Windows MSI installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Locate WiX Toolset v3 on runner
          $wixDir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wixDir -and (Test-Path "$($wixDir.FullName)\bin")) {
            $binPath = "$($wixDir.FullName)\bin"
          } elseif ($env:WIX -and (Test-Path "$env:WIX\bin")) {
            $binPath = "$env:WIX\bin"
          } else {
            Write-Error "WiX Toolset v3 not found on runner."
            exit 1
          }
          $env:PATH = "$binPath;$env:PATH"

          # Determine semantic version (strip leading 'v' if present)
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          if (-not $version -or $version -eq $tag) {
            $cargoToml = Get-Content Cargo.toml -Raw
            if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
              $version = $matches[1]
            } else {
              $version = "0.4.0"
            }
          }

          New-Item -ItemType Directory -Force -Path target\wix
          candle.exe -arch x64 -ext WixUIExtension -dVersion="$version" -dCargoTargetBinDir="target\${{ matrix.target }}\release" -out target\wix\main.wixobj wix\main.wxs
          light.exe -ext WixUIExtension -spdb -out ${{ matrix.msi_name }} target\wix\main.wixobj

      - name: Upload Linux artifact to Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true

      - name: Upload Windows artifacts to Release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.portable_zip }}
            ${{ matrix.msi_name }}
          generate_release_notes: true
